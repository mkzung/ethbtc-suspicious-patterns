name: tests + reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Run analyze.py end-to-end
        run: python analyze.py

      - name: Committed findings.json reproduces on this runner (cross-platform check)
        run: git diff --exit-code findings.json

      - name: Run audit.py
        run: python audit.py > audit.txt

      - name: Reproducibility — findings.json byte-identical on rerun
        run: |
          mv findings.json findings.first.json
          python analyze.py
          diff findings.first.json findings.json && echo "byte-identical reproducibility verified"

      - name: Calibration — detectors don't fire on synthetic clean data
        run: python calibration.py

      - name: Upload generated figures
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: figures-${{ matrix.python-version }}
          path: figures/

      - name: Upload findings.json
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.python-version }}
          path: findings.json
